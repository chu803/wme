# ==============================================================================
#  AI 智能水印擦除工作台 —— 项目元数据（阶段 297 · 发布 v1.0 基建；[project.scripts] 三件套已补齐）
#
#  本文件的定位（先读这段，避免误解）
#  --------------------------------
#  · 本文件提供**项目元数据**（名称 / 版本 / 描述 / 许可 / 所需 Python），
#    使工具链（打包、依赖扫描、编辑器、GitHub 等）能读到统一的项目身份。
#  · **依赖清单的真值来源仍是 `requirements*.txt`**（安装方式与清华镜像说明都在那里），
#    此处**刻意不复制**一份 `dependencies`，避免两处清单慢慢漂移（LESSONS 187/195）。
#  · 版本号唯一真值来源是 `config.APP_VERSION`；此处写同一数值并由
#    `tests/test_packaging_meta.py` 断言两者一致（不采用 setuptools 的
#    `dynamic = {attr = ...}`，因为那会在**构建时导入 config.py**，而 config.py
#    在导入期会读环境变量并解析目录 ⇒ 构建副作用，得不偿失）。
#
#  尚未启用（显式登记为待决策，不是遗漏）
#  ------------------------------------
#  · 发布到 PyPI / 打 wheel 分发：需先定「哪些模块随包发布」的口径。
#    本文件的 `py-modules` / `packages.find` 已按仓库现状显式声明，
#    足以支撑**本地可安装**（`pip install .`）与元数据读取。
#  · **`[project.scripts]` 控制台入口已于阶段 296 补齐**（见下方表格）：
#    命令名采用 `wme` / `wme-cli` / `wme-api` 三件套（命名属发布范围决策，
#    如需改名直接改下表即可）。此前启动靠 `python main.py` / Docker，
#    现 wheel 安装后可直接以命令调用，服务「发布 v1.0」。
# ==============================================================================
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wme-watermark-eraser"
version = "1.0.1"
description = "AI 智能水印擦除工作台：本地离线、免手涂的 AI 图片/PDF/视频可见水印检测与修复工具"
readme = "README.md"
requires-python = ">=3.11"
# 许可文件（阶段 293 迁移）：旧的 license table 形式（license = { file = "LICENSE" }）
#   自 setuptools 77 起弃用，2027-02-18 后构建不再被支持。本作为专有许可（无 SPDX
#   标识），故按 PEP 639 用 license-files 随包附带 LICENSE 文本，不写 SPDX 表达式；
#   配套 build-system 的 setuptools 下限已提到 >=77。守卫见 tests/test_packaging_meta.py。
license-files = ["LICENSE"]
authors = [{ name = "AI Watermark Eraser Workbench" }]
keywords = ["watermark", "inpainting", "lama", "opencv", "gradio", "offline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Utilities",
    "Environment :: Console",
    "Operating System :: OS Independent",
]

# PyPI 项目页「Project links」：提升包可发现性与信任度（生态档 D→C 起手式）。
[project.urls]
Homepage = "https://github.com/chu803/wme"
Repository = "https://github.com/chu803/wme"
Documentation = "https://github.com/chu803/wme#readme"
Changelog = "https://github.com/chu803/wme/blob/main/CHANGELOG.md"

# 控制台入口（阶段 296 补齐，服务「发布 v1.0」）。
# 命名属发布范围决策：wme=UI 主入口 / wme-cli=批量命令行 / wme-api=REST 服务。
# 三入口函数均无必需参数（start_server 三参全默认、main() 无参、cli.main(argv=None)），
# 可直接由 pip 安装出的命令无参调用。守卫见 tests/test_packaging_meta.py。
[project.scripts]
wme = "main:main"
wme-cli = "cli:main"
wme-api = "server:start_server"

[tool.setuptools]
# 顶层单文件模块（与仓库现状一一对应；`conftest.py` 是测试夹具，不发布）
py-modules = [
    "api",
    "cli",
    "config",
    "download_model",
    "main",
    "server",
]

[tool.setuptools.packages.find]
# 顶层包（均带 `__init__.py`，setuptools 才能发现）。
# ⚠ 刻意**不含** `scripts*`：该目录没有 `__init__.py`，`find` 根本发现不了它
#   （写了等于声明与实现不符，`tests/test_packaging_meta.py` 会报错拦住）。
#   门禁/探针脚本是项目的**可复现资产、留在仓库里**，不随分发包发布。
# ⚠ 也**不含** `tests`：测试套件不随分发发布。
include = ["core*", "services*", "ui*", "utils*"]

# 注：覆盖率口径的**权威文件是 `.coveragerc`**（含 `parallel = False` 的环境说明）。
# 此处**刻意不写** `[tool.coverage.*]`——coverage 只读它找到的第一个配置文件，
# 两处都写会造成「改了一处不生效」的静默陷阱。
