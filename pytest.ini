[pytest]
# 测试目录；所有 tests/test_*.py 都会被收集。
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 自定义标记：离线 CI 默认跳过 torch_required / network。
markers =
    torch_required: 需要 PyTorch 的用例（离线 CI 跳过）
    network: 需要网络的用例（离线 CI 跳过，如下载模型）
    slow: 耗时较长的用例（如运行模块 __main__ 自检）

# 默认参数：-ra 汇总跳过/失败，-q 精简输出，--timeout 防卡死。
addopts = -ra -q --timeout=300
