# ==============================================================================
#  AI 智能水印擦除工作台 —— GitHub Actions 持续集成
#  说明：
#    本工作流补齐项目此前缺失的「机器可判定质量门禁」（阶段 116 新增）。
#    pytest.ini 早已声明 torch_required / network 两个标记（用于「离线 CI 跳过」），
#    但仓库一直没有 CI —— 本文件把那一约定真正落地。
#
#  阶段 184 修正：**改为调用统一验证入口** `scripts/run_all_checks.py`。
#    起因：阶段 183 首次跑全库，暴露 6 处跨阶段锚点腐化（守卫常红 / 断言停在旧世界 /
#    新模块漏登记）。根因是「没有任何一个命令要求全都跑一遍」——
#    本工作流虽在 116 就写好，但项目**尚未纳入版本控制**（无 .git）⇒ 从未执行；
#    而本地也没有等价入口 ⇒ 红灯被隔离在视野之外。
#    现在 CI 与本地跑**同一套步骤**（测试 + 静态扫描），marker 选择只有一处真值来源，
#    避免「CI 与本地各写一遍、慢慢漂移」。
#
#  策略：
#    · 安装最小依赖 + 测试依赖（不装 torch，保持 CI 轻量快速）；
#    · 由入口脚本按 pytest.ini 约定跳过 torch_required / network 标记的用例；
#    · 在 Python 3.11 上跑「CI 等价子集」。
#  注意：本 CI 覆盖的是「无 torch 环境下的逻辑正确性」；真实超分 / LaMa 权重
#        相关用例需在带 torch 的环境单独跑（见 docs/108、docs/115、docs/184）。
# ==============================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      # ⚠ 每个 step 都必须有 `id`（守卫：tests/test_run_all_checks.py::test_every_workflow_step_has_an_id）。
      #   原因：失败诊断步骤只能靠 `toJSON(steps)` 拿到**有 id 的步骤**的结果；漏 id 的那一步
      #   在状态表里**静默消失**——而「哪一步红了」正是诊断唯一要回答的问题（331 之后第一次 CI 红
      #   就是因为拿不到这一步，只能让人截图）。
      - name: 拉取代码
        id: checkout
        uses: actions/checkout@v4

      - name: 安装 Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 系统依赖（OpenCV / Gradio 运行时）
        id: system
        run: |
          set -eo pipefail
          mkdir -p logs
          sudo apt-get update 2>&1 | tee logs/system.log
          # ⚠ 阶段 351：Ubuntu 24.04（noble）起 glib 的包名带 **t64**
          # （`libglib2.0-0` → `libglib2.0-0t64`），且**过渡包 `libglib2.0-0` 被删**
          # ⇒ 写死旧包名会在新镜像上直接 "Unable to locate package" ⇒ 整个 job 一分钟红。
          # 这类「runner 镜像自己会变」的依赖，必须**按镜像里实际有哪个来挑**，不能写死。
          # 证据：launchpad #2063221「Drop libglib2.0-0 transitional package」（Noble）。
          GLIB=$(apt-cache show libglib2.0-0t64 >/dev/null 2>&1 && echo libglib2.0-0t64 || echo libglib2.0-0)
          echo "使用系统包：$GLIB"
          sudo apt-get install -y --no-install-recommends \
            libgl1 libsm6 libxext6 libxrender1 "$GLIB" 2>&1 | tee logs/system_install.log

      - name: 安装依赖（最小集 + 测试依赖）
        id: deps
        run: |
          set -eo pipefail
          mkdir -p logs
          python -m pip install --upgrade pip setuptools wheel 2>&1 | tee logs/deps_upgrade.log
          pip install -r requirements-min.txt 2>&1 | tee logs/deps_min.log
          pip install -r requirements-dev.txt 2>&1 | tee logs/deps_dev.log

      - name: 运行验证入口（测试 + 静态扫描，与本地同一入口）
        id: entry
        # 阶段 329：必须显式 `shell: bash` + `set -eo pipefail`。
        # 不给 shell 时 GH 默认用 `sh -e`（**不带 pipefail**），于是 `python … | tee` 的
        # 退出码取 `tee` 的 0 ⇒ 门禁判失败也照样绿，「不过门禁不发布」形同装饰
        # （本机复现：`sh -e -c 'false | tee /dev/null'` 退出码 0；`bash -eo pipefail` 为 1）。
        # 守卫：tests/test_run_all_checks.py::test_piped_gate_step_cannot_swallow_the_exit_code
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p logs
          python scripts/run_all_checks.py 2>&1 | tee gate_output.txt | tee logs/entry.log

      - name: 诊断：门禁失败 → FAILED 清单写入 Summary 并建 issue（供自动读取，修完可删）
        id: diagnose
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let out = '(no gate_output.txt)';
            try { out = fs.readFileSync('gate_output.txt', 'utf8'); } catch (e) {}
            const lines = out.split('\n');
            const failed = lines.filter(l => l.indexOf('FAILED') !== -1);
            const block = failed.length ? failed.join('\n') : lines.slice(-120).join('\n');
            // 阶段 356：把**各步骤自己的日志尾巴**也带上（安装类失败的原因只在 runner 日志里，
            // 以前只能让人截图）。有 logs/<step-id>.log 就取最后 40 行。
            let stepLogs = '';
            try {
              const dir = 'logs';
              const files = fs.readdirSync(dir).filter(f => f.endsWith('.log'));
              const parts = [];
              for (const f of files) {
                const txt = fs.readFileSync(dir + '/' + f, 'utf8').split('\n');
                parts.push('### ' + f + '\n' + txt.slice(-40).join('\n'));
              }
              stepLogs = parts.join('\n\n');
            } catch (e) { stepLogs = '(no logs/)'; }
            // 「哪一步红的」必须是第一句话。gate_output.txt 只在 entry 步真跑过才存在；
            // 早于它的任何一步（apt/pip）失败时，旧版诊断只会写一句没用的 (no gate_output.txt)。
            let stepStatus = {};
            try { stepStatus = ${{ toJSON(steps) }} || {}; } catch (e) { stepStatus = {}; }
            const rows = Object.entries(stepStatus)
              .filter(([id, v]) => v && (v.conclusion || v.outcome))
              .map(([id, v]) => `${id}: ${v.outcome || v.conclusion}`);
            const table = rows.length ? rows.join('\n') : '(步骤状态不可用：请确认每个 step 都有 id)';
            await core.summary
              .addHeading('CI 门禁失败 · 哪一步红了', 2).addRaw('```\n' + table + '\n```')
              .addHeading('CI 门禁失败 · 各步骤日志尾巴', 2).addRaw('```\n' + stepLogs + '\n```')
              .addHeading('CI 门禁失败 · FAILED 清单', 2).addRaw('```\n' + block + '\n```').write();
            try {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'CI 失败诊断 ' + context.sha.slice(0, 7),
                body: '## 哪一步红了\n\n```\n' + table + '\n```\n\n## 各步骤日志尾巴\n\n```\n'
                      + stepLogs + '\n```\n\n## FAILED 清单\n\ncommit `'
                      + context.sha.slice(0, 10) + '`\n\n```\n' + block + '\n```\n\n_ci.yml 自动诊断；修复后请关闭/删除。_',
              });
            } catch (e) { core.warning('issue 创建失败，Summary 仍有清单: ' + e.message); }
