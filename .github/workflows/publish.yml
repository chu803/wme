# ==============================================================================
#  AI 智能水印擦除工作台 —— GitHub Actions 发布管线（阶段 297-c · 选项 3 落地）
#
#  本工作流把「发布 v1.0」从口头目标落成一键可执行：
#    ① 打 tag（v*）或手动触发 → ② 先跑与 CI 同一套质量门禁 → ③ 构建 wheel+sdist
#       → ④ 发布到 PyPI。
#
#  设计约定（与 ci.yml 对齐，避免两套步骤漂移）：
#    · 门禁步骤复用 ci.yml 的「最小依赖 + 测试依赖 + 系统库 + run_all_checks.py」；
#    · 构建用 `python -m build`（官方 PyPI 提供 setuptools>=77，不受本机清华镜像缺包影响）；
#    · 发布用 `pypa/gh-action-pypi-publish`，凭据走仓库 Secret `PYPI_API_TOKEN`。
#
#  需要你侧配置（一次性）：
#    1. GitHub 仓库 Settings → Secrets → Actions 新增 `PYPI_API_TOKEN`（PyPI 账号的 API token）。
#    2. （可选）改用 PyPI Trusted Publisher（OIDC，免 token）——需在 PyPI 项目页配置
#       对应仓库/工作流，并把下方 password 整段删掉、改用 `id-token: write` 权限。
#
#  注意：本机 managed venv 未装 numpy/gradio 等全套运行期依赖，无法在此真跑
#        `pip install .` 全量；本工作流在 GitHub 官方环境用 requirements-min/dev
#        跑门禁、用官方 PyPI 取构建依赖，可补上本机缺的那一环。
# ==============================================================================
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    # 显式授权：diagnostic 步建 issue 需 issues:write（若改 OIDC Trusted Publisher，换 id-token:write 并删下方 password）
    permissions:
      contents: read
      issues: write

    steps:
      # ⚠ 每个 step 都必须有 `id`（守卫：tests/test_run_all_checks.py::test_every_workflow_step_has_an_id）；
      #   失败诊断只能从 `toJSON(steps)` 里读到**有 id 的步骤**的结果。
      - name: 拉取代码
        id: checkout
        uses: actions/checkout@v4

      - name: 安装 Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 系统依赖（OpenCV / Gradio 运行时）
        id: system
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender1

      - name: 安装依赖（最小集 + 测试依赖）
        id: deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-min.txt
          pip install -r requirements-dev.txt

      - name: 运行验证入口（与 CI 同一套门禁，不过门禁不发布）
        id: entry
        # 阶段 329：同 ci.yml——不显式给 `shell: bash` + `pipefail` 时，
        # `... | tee` 会把门禁退出码吞成 0，这条「不发布」的门禁**从未真正生效**。
        shell: bash
        run: |
          set -eo pipefail
          python scripts/run_all_checks.py 2>&1 | tee gate_output.txt

      - name: 诊断：门禁失败 → FAILED 清单写入 Summary 并建 issue（供自动读取，修完可删）
        id: diagnose
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let out = '(no gate_output.txt)';
            try { out = fs.readFileSync('gate_output.txt', 'utf8'); } catch (e) {}
            const lines = out.split('\n');
            const failed = lines.filter(l => l.indexOf('FAILED') !== -1);
            const block = failed.length ? failed.join('\n') : lines.slice(-120).join('\n');
            // 同 ci.yml：第一句必须是「哪一步红了」，否则 pip/apt 失败时这里只会写 (no gate_output.txt)。
            let stepStatus = {};
            try { stepStatus = ${{ toJSON(steps) }} || {}; } catch (e) { stepStatus = {}; }
            const rows = Object.entries(stepStatus)
              .filter(([id, v]) => v && (v.conclusion || v.outcome))
              .map(([id, v]) => `${id}: ${v.outcome || v.conclusion}`);
            const table = rows.length ? rows.join('\n') : '(步骤状态不可用：请确认每个 step 都有 id)';
            await core.summary
              .addHeading('门禁失败 · 哪一步红了', 2).addRaw('```\n' + table + '\n```')
              .addHeading('门禁失败 · FAILED 清单', 2).addRaw('```\n' + block + '\n```').write();
            try {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '门禁失败诊断 ' + context.sha.slice(0, 7),
                body: '## 哪一步红了\n\n```\n' + table + '\n```\n\n## FAILED 清单\n\ncommit `'
                      + context.sha.slice(0, 10) + '`\n\n```\n' + block + '\n```\n\n_publish.yml 自动诊断；修复后请关闭/删除。_',
              });
            } catch (e) { core.warning('issue 创建失败，Summary 仍有清单: ' + e.message); }

      - name: 安装构建工具
        id: buildtools
        run: python -m pip install --upgrade build

      - name: 构建 wheel + sdist
        id: build
        run: python -m build

      - name: 上传构建产物（安全网：未配 PYPI_API_TOKEN 也能在 Actions 下载 wheel+sdist 本地试装）
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: 发布到 PyPI
        id: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
